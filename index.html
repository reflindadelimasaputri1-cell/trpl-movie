```html
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRPL Movie</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .movie-card {
            height: 100%;
        }

        .movie-card img {
            height: 400px;
            object-fit: cover;
        }

        .movie-title {
            min-height: 48px;
        }

        #loading {
            display: none;
        }

        #message {
            display: none;
        }

        .modal-poster {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="#">
                TRPL Movie
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Search Movie
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- CONTENT -->
    <div class="container py-5">

        <div class="text-center mb-4">

            <h1>
                Search Movie
            </h1>

            <p class="text-muted">
                Cari informasi film menggunakan Public API OMDb
            </p>

        </div>


        <!-- SEARCH -->
        <div class="row justify-content-center mb-4">

            <div class="col-md-8">

                <div class="input-group">

                    <input
                        type="text"
                        id="search-input"
                        class="form-control"
                        placeholder="Masukkan judul film...">

                    <button
                        id="button-search"
                        class="btn btn-primary">

                        Search

                    </button>

                </div>

            </div>

        </div>


        <!-- LOADING -->
        <div
            id="loading"
            class="text-center mb-4">

            <div
                class="spinner-border text-primary"
                role="status">

                <span class="visually-hidden">
                    Loading...
                </span>

            </div>

            <p class="mt-2">
                Sedang mencari film...
            </p>

        </div>


        <!-- MESSAGE -->
        <div
            id="message"
            class="alert alert-warning text-center">
        </div>


        <hr>


        <!-- HASIL PENCARIAN -->
        <div
            id="movie-list"
            class="row g-4">

        </div>

    </div>


    <!-- MODAL DETAIL FILM -->
    <div
        class="modal fade"
        id="movieModal"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="modal-title">

                        Detail Film

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <div class="row">

                        <!-- POSTER -->
                        <div class="col-md-4">

                            <img
                                id="modal-poster"
                                class="modal-poster"
                                src=""
                                alt="Poster Film">

                        </div>


                        <!-- INFORMASI -->
                        <div class="col-md-8">

                            <h3 id="modal-movie-title">
                                -
                            </h3>

                            <p>
                                <strong>Tahun:</strong>
                                <span id="modal-year">
                                    -
                                </span>
                            </p>

                            <p>
                                <strong>Genre:</strong>
                                <span id="modal-genre">
                                    -
                                </span>
                            </p>

                            <p>
                                <strong>Director:</strong>
                                <span id="modal-director">
                                    -
                                </span>
                            </p>

                            <p>
                                <strong>Actors:</strong>
                                <span id="modal-actors">
                                    -
                                </span>
                            </p>

                            <p>
                                <strong>Rating IMDb:</strong>
                                <span id="modal-rating">
                                    -
                                </span>
                            </p>

                            <p>
                                <strong>Runtime:</strong>
                                <span id="modal-runtime">
                                    -
                                </span>
                            </p>

                            <hr>

                            <p>
                                <strong>Plot:</strong>
                            </p>

                            <p id="modal-plot">
                                -
                            </p>

                        </div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Tutup

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- JavaScript Project -->
    <script src="js/script.js"></script>

</body>

</html>
```
